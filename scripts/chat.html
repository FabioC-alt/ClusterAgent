<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cluster Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#1f1f1f;--muted:#6b6b6b;--border:#e3e3df;--accent:#c96442;--user:#efede6;--code:#f1f0ec}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1c;--panel:#262624;--text:#ececea;--muted:#a3a39e;--border:#3a3a37;--accent:#d97757;--user:#30302d;--code:#2f2f2c}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:14px;color:var(--muted);flex-wrap:wrap}
header input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font:inherit;width:210px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:6px;vertical-align:middle}
.ok{background:#3a9e5c}.bad{background:#c94242}
.spacer{flex:1}
main{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:780px;margin:0 auto}
.msg{margin:0 0 22px}
.user{background:var(--user);padding:10px 14px;border-radius:14px;margin-left:auto;max-width:85%;width:fit-content;white-space:pre-wrap;word-wrap:break-word}
.bot p:first-child{margin-top:0}
.bot pre{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto}
.bot code{background:var(--code);padding:1px 4px;border-radius:4px;font-size:.92em}
.bot pre code{padding:0;background:none}
.bot table{border-collapse:collapse}.bot td,.bot th{border:1px solid var(--border);padding:4px 8px}
details{color:var(--muted);font-size:14px;border-left:2px solid var(--border);padding-left:10px;margin-bottom:12px}
details summary{cursor:pointer}
details div{white-space:pre-wrap}
.typing{color:var(--muted)}
.err{color:#c94242}
.empty{color:var(--muted);text-align:center;margin-top:18vh}
footer{border-top:1px solid var(--border);padding:12px 16px}
form{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:10px 14px;font:inherit;max-height:220px;outline:none}
textarea:focus{border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--muted);border:1px solid var(--border);padding:4px 12px;border-radius:6px}
</style>
</head>
<body>
<header>
  <span><span id="dot" class="dot"></span><span id="status">Checking connection…</span></span>
  <span class="spacer"></span>
  <label>Server <input type="text" id="url" value="http://localhost:8001/v1"></label>
  <label title="Let the model reason step by step before answering (slower, smarter)"><input type="checkbox" id="think"> Thinking</label>
  <button class="sec" id="clear" type="button">New chat</button>
</header>
<main id="main"><div class="wrap" id="log"><div class="empty" id="empty">Ask anything to the model running on your cluster.</div></div></main>
<footer>
  <form id="form">
    <textarea id="box" rows="1" placeholder="Message… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</footer>
<script>
const $ = s => document.querySelector(s);
const log = $('#log'), box = $('#box'), main = $('#main'), sendBtn = $('#send');
let history = [], model = null, busy = false, ctrl = null;

const base = () => $('#url').value.replace(/\/+$/, '');
const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
const md = t => (window.marked && window.DOMPurify)
  ? DOMPurify.sanitize(marked.parse(t))
  : '<div style="white-space:pre-wrap">' + esc(t) + '</div>';
const scroll = () => { main.scrollTop = main.scrollHeight; };

function setStatus(ok, text) {
  $('#dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  $('#status').textContent = text;
}

async function check() {
  try {
    const r = await fetch(base() + '/models');
    const j = await r.json();
    model = j.data[0].id;
    setStatus(true, 'Connected · ' + model);
  } catch (e) {
    model = null;
    setStatus(false, 'Not connected: is the job running and the SSH tunnel open?');
  }
}

// Split Qwen-style "<think>...</think>answer" text
function split(t) {
  const i = t.indexOf('<think>');
  if (i < 0) return { think: '', answer: t, open: false };
  const j = t.indexOf('</think>');
  if (j < 0) return { think: t.slice(i + 7).trim(), answer: '', open: true };
  return { think: t.slice(i + 7, j).trim(), answer: t.slice(j + 8).trim(), open: false };
}

function renderBot(el, full, reason, done) {
  let p = split(full);
  if (reason) p = { think: reason.trim(), answer: full.trim(), open: !full.trim() && !done };
  let h = '';
  if (p.think) h += `<details${p.open ? ' open' : ''}><summary>${p.open ? 'Thinking…' : 'Thought process'}</summary><div>${esc(p.think)}</div></details>`;
  h += p.answer ? md(p.answer) : (done ? '' : '<p class="typing">…</p>');
  el.innerHTML = h;
  return p.answer;
}

function addMsg(cls, html) {
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  log.appendChild(el);
  scroll();
  return el;
}

async function send(text) {
  if (!model) await check();
  if (!model) return;
  addMsg('user', esc(text));
  history.push({ role: 'user', content: $('#think').checked ? text : text + ' /no_think' });
  const el = addMsg('bot', '<p class="typing">…</p>');
  let full = '', reason = '';
  busy = true; sendBtn.textContent = 'Stop'; ctrl = new AbortController();
  try {
    const r = await fetch(base() + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: history, stream: true }),
      signal: ctrl.signal
    });
    if (!r.ok) throw new Error('Server error ' + r.status + ': ' + await r.text());
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        const s = l.trim();
        if (!s.startsWith('data:')) continue;
        const d = s.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const c = JSON.parse(d).choices?.[0]?.delta || {};
          full += c.content || '';
          reason += c.reasoning_content || c.reasoning || '';
        } catch {}
      }
      renderBot(el, full, reason, false); scroll();
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      el.insertAdjacentHTML('beforeend', '<p class="err">' + esc(e.message) + '</p>');
      if (/Failed to fetch|NetworkError/.test(e.message)) check();
    }
  }
  const answer = renderBot(el, full, reason, true);
  history.push({ role: 'assistant', content: answer });
  busy = false; sendBtn.textContent = 'Send'; scroll(); box.focus();
}

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { ctrl?.abort(); return; }
  const t = box.value.trim();
  if (!t) return;
  box.value = ''; box.style.height = 'auto';
  send(t);
});
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); }
});
box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = box.scrollHeight + 'px'; });
$('#clear').addEventListener('click', () => {
  if (busy) ctrl?.abort();
  history = [];
  log.innerHTML = '<div class="empty" id="empty">New chat started.</div>';
  box.focus();
});
$('#url').addEventListener('change', check);

check();
setInterval(() => { if (!busy) check(); }, 15000);
box.focus();
</script>
</body>
</html>
